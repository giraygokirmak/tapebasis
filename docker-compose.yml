services:
  tapebasis:
    build:
      context: .
      dockerfile: Dockerfile
    # Built from this checkout. To run the published image instead, delete the
    # `build:` block above and uncomment this line:
    # image: ghcr.io/giraygokirmak/tapebasis:latest
    image: tapebasis:latest
    container_name: tapebasis
    # Belt and braces with the image's own tini: compose's init runs as PID 1
    # and forwards signals, so `docker compose stop` is graceful even if the
    # image is swapped for the plain GHCR tag.
    init: true
    # The server has no authentication, so publish to host loopback by default.
    # An operator must set TAPEBASIS_BIND_ADDRESS explicitly for remote access.
    ports:
      - "${TAPEBASIS_BIND_ADDRESS:-127.0.0.1}:6013:8000"
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      # Finviz is scraped; keep the cache short so quotes stay fresh.
      - FINVIZ_CACHE_TTL=30
      - FINVIZ_TIMEOUT=25
      # Provider health / schema-drift monitor.
      - TAPEBASIS_HEALTH_ENABLED=true
      - TAPEBASIS_HEALTH_INTERVAL=300
      - TAPEBASIS_HEALTH_TTL=60
      - TAPEBASIS_HEALTH_STATE=/home/mcpuser/.tapebasis/state/health_state.json
      - FINVIZ_CHART_DIR=/home/mcpuser/.tapebasis/charts
    volumes:
      # Persist chart PNGs and the drift-detection baselines across restarts.
      - tapebasis-state:/home/mcpuser/.tapebasis
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  tapebasis-state:
