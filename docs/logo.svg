<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="tbTitle tbDesc">
  <title id="tbTitle">Tapebasis</title>
  <desc id="tbDesc">Ticker tapes, one cool and one warm, cross on a single marked print: the basis between feeds is zero.</desc>

  <defs>
    <linearGradient id="tbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a101c"/>
      <stop offset="0.55" stop-color="#0e1729"/>
      <stop offset="1" stop-color="#121d33"/>
    </linearGradient>

    <!-- One feed reads cool. -->
    <linearGradient id="tbCool" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- The other reads warm. -->
    <linearGradient id="tbWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>

    <radialGradient id="tbGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <filter id="tbBloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <path id="tbCoolCurve" d="M62 386 C 142 386, 198 328, 256 256 C 314 184, 370 126, 450 126"/>
    <path id="tbWarmCurve" d="M62 126 C 142 126, 198 184, 256 256 C 314 328, 370 386, 450 386"/>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#tbBg)"/>
  <circle cx="256" cy="256" r="148" fill="url(#tbGlow)"/>

  <!-- The zero-basis line: whatever the two feeds report, this is what is measured. -->
  <path d="M40 256 H472" stroke="#5eead4" stroke-opacity="0.20"
        stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>

  <!-- Tapes: dark underlay for thickness, then the gradient on top. -->
  <use href="#tbCoolCurve" fill="none" stroke="#02060d" stroke-opacity="0.6" stroke-width="27" stroke-linecap="round"/>
  <use href="#tbWarmCurve" fill="none" stroke="#02060d" stroke-opacity="0.6" stroke-width="27" stroke-linecap="round"/>
  <use href="#tbCoolCurve" fill="none" stroke="url(#tbCool)" stroke-width="18" stroke-linecap="round"/>
  <use href="#tbWarmCurve" fill="none" stroke="url(#tbWarm)" stroke-width="18" stroke-linecap="round"/>

  <!-- Ticker ticks riding each tape, thinning as the feeds converge on the print. -->
  <g stroke-width="5.5" stroke-linecap="round">
    <path d="M100 379 v-20" stroke="#2dd4bf" opacity="0.95"/>
    <path d="M140 355 v-19" stroke="#2dd4bf" opacity="0.65"/>
    <path d="M176 322 v-18" stroke="#2dd4bf" opacity="0.40"/>
    <path d="M412 133 v20"  stroke="#3b82f6" opacity="0.95"/>
    <path d="M372 157 v19"  stroke="#3b82f6" opacity="0.65"/>
    <path d="M336 190 v18"  stroke="#3b82f6" opacity="0.40"/>

    <path d="M412 379 v-20" stroke="#f97316" opacity="0.95"/>
    <path d="M372 355 v-19" stroke="#f97316" opacity="0.65"/>
    <path d="M336 322 v-18" stroke="#f97316" opacity="0.40"/>
    <path d="M100 133 v20"  stroke="#fbbf24" opacity="0.95"/>
    <path d="M140 157 v19"  stroke="#fbbf24" opacity="0.65"/>
    <path d="M176 190 v18"  stroke="#fbbf24" opacity="0.40"/>
  </g>

  <!-- The print both feeds agree on. -->
  <circle cx="256" cy="256" r="40" fill="#5eead4" opacity="0.22" filter="url(#tbBloom)"/>
  <circle cx="256" cy="256" r="30" fill="#0a101c" stroke="#5eead4" stroke-width="8"/>
  <circle cx="256" cy="256" r="11" fill="#5eead4"/>
  <circle cx="256" cy="256" r="19" fill="none" stroke="#5eead4" stroke-opacity="0.30" stroke-width="2"/>
</svg>
