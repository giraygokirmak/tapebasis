# Validate every push, build the release artifacts, and publish them on a v* tag.
#
# Main and manual runs stop after validation: the wheel, sdist, npm tarball and
# OCI image are built and checked, never published. A v* tag builds the same
# artifacts once, records their digests, and waits for the protected `release`
# environment before uploading those exact files. Nothing is rebuilt after the
# approval, so the bytes that passed the smoke tests are the bytes that ship.
#
# Tags are not created here. See docs/wiki/Releasing.md for the one-time
# account setup and the release steps.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      recover_source_run:
        description: Approved earlier tag-run id for MCP-only recovery
        required: false
        type: string
      recover_tag:
        description: Existing immutable tag, exactly matching all package versions
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  MCP_PUBLISHER_VERSION: v1.8.9
  MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
  REGCTL_VERSION: v0.11.7
  REGCTL_SHA256: 3737fbbdd791e04e7a831640b681f3397a376498e80e2ad9b1b2d27296f239bc

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/test.yml

  build:
    name: Build release artifacts
    needs: validate
    if: github.event_name != 'workflow_dispatch' || (inputs.recover_source_run == '' && inputs.recover_tag == '')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"

      - id: meta
        name: Validate the release identity and history
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          uv venv
          uv pip install -e ".[dev]"
          if [ "$REF_TYPE" = tag ]; then
            previous=""
            while IFS= read -r candidate; do
              if [ "$candidate" != "$REF_NAME" ]; then
                previous="$candidate"
                break
              fi
            done < <(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname)
            if [ -n "$previous" ]; then
              .venv/bin/python scripts/check_release.py --tag "$REF_NAME" --against "$previous"
            else
              .venv/bin/python scripts/check_release.py --tag "$REF_NAME"
            fi
          else
            .venv/bin/python scripts/check_release.py
          fi
          version="$(.venv/bin/python -c 'from tapebasis import __version__; print(__version__)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate the official MCP Registry manifest
        run: |
          set -euo pipefail
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" mcp-publisher
          ./mcp-publisher validate server.json
          rm -f "$archive" mcp-publisher

      - name: Build the Python distributions
        run: uv build --clear --no-sources --out-dir dist

      - name: Install and smoke-test the built distributions
        env:
          TAPEBASIS_HEALTH_ENABLED: "false"
        run: |
          set -euo pipefail
          for artifact in dist/*; do
            uv run --isolated --no-project --python 3.12 \
              --with "$artifact" tests/smoke_test.py
          done

      - name: Build and smoke-test the npm tarball
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm test
          npm pack --pack-destination dist
          .venv/bin/python -m pytest -q tests/test_packaging.py -k npm

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build the multi-platform OCI archive without publishing it
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=dist/tapebasis-image.tar
          labels: io.modelcontextprotocol.server.name=io.github.giraygokirmak/tapebasis
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Inspect the packaged OCI image
        run: .venv/bin/python scripts/check_oci_image.py dist/tapebasis-image.tar

      - name: Smoke-test the local amd64 image without a registry
        run: |
          set -euo pipefail
          docker build --tag tapebasis-ci:test .
          output="$(docker run --rm --entrypoint tapebasis tapebasis-ci:test --help)"
          echo "$output" | grep -F streamable-http >/dev/null

      - name: Record the artifact digests
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ needs.build.outputs.version }}
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Recheck the approved tag and metadata
        run: python3 scripts/check_release.py --tag "${GITHUB_REF_NAME}"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-artifacts
          path: dist

      - name: Require the tested distributions to be present
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          test -f "dist/tapebasis-${VERSION}-py3-none-any.whl"
          test -f "dist/tapebasis-${VERSION}.tar.gz"
          test -f "dist/tapebasis-${VERSION}.tgz"
          test -f dist/tapebasis-image.tar
          (cd dist && sha256sum --check --strict SHA256SUMS)
          python3 scripts/check_oci_image.py dist/tapebasis-image.tar

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"

      - name: Verify the packed launcher before upload
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: npm install --global --ignore-scripts "./dist/tapebasis-${VERSION}.tgz"

      - name: Compare the existing PyPI version with tested bytes
        id: pypi
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          python3 scripts/release_registry.py pypi --version "$VERSION"
          --dist dist --output "$GITHUB_OUTPUT"

      # PEP 740 attestations are needed only for a genuinely new PyPI upload.
      - uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a  # v0.0.7
        if: steps.pypi.outputs.pypi_status == 'missing'
        with:
          paths: dist/*.whl dist/tapebasis-*.tar.gz

      - name: Publish the distributions to PyPI only when absent
        if: steps.pypi.outputs.pypi_status == 'missing'
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple dist/tapebasis-*.whl dist/tapebasis-*.tar.gz

      - name: Verify PyPI after conditional publication
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python3 scripts/release_registry.py pypi --version "$VERSION" --dist dist --require-existing

      - name: Compare npm with the tested tarball
        id: npm
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          python3 scripts/release_registry.py npm --version "$VERSION"
          --dist dist --output "$GITHUB_OUTPUT"
      - name: Require the existing npm release to be the documented bootstrap
        if: steps.npm.outputs.npm_status == 'verified'
        env:
          NPM_BOOTSTRAPPED: ${{ vars.TAPEBASIS_NPM_BOOTSTRAPPED }}
        run: test "$NPM_BOOTSTRAPPED" = 1

      - name: Publish an absent npm version through GitHub OIDC
        if: steps.npm.outputs.npm_status == 'missing'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: npm publish "dist/tapebasis-${VERSION}.tgz" --access public

      - name: Verify npm after conditional publication
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          python3 scripts/release_registry.py npm --version "$VERSION"
          --dist dist --require-existing

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Download and verify mcp-publisher and regctl
        run: |
          set -euo pipefail
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          ./mcp-publisher validate server.json
          curl --fail --location --silent --show-error --output regctl \
            "https://github.com/regclient/regclient/releases/download/${REGCTL_VERSION}/regctl-linux-amd64"
          echo "${REGCTL_SHA256}  regctl" | sha256sum --check --strict
          chmod +x regctl
          ./mcp-publisher login github-oidc

      - name: Complete and verify GHCR without replacing matching tags
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: bash ./scripts/verify_ghcr.sh "$VERSION" publish-missing

      - name: Check MCP Registry metadata before publishing
        id: mcp
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          python3 scripts/release_registry.py mcp --version "$VERSION"
          --server server.json --output "$GITHUB_OUTPUT"

      - name: Publish the server to the MCP Registry only when absent
        if: steps.mcp.outputs.mcp_status == 'missing'
        run: ./mcp-publisher publish server.json

      - name: Recheck the published MCP Registry metadata
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          python3 scripts/release_registry.py mcp --version "$VERSION"
          --server server.json

  recover-source:
    name: Validate source artifacts for approved MCP-only recovery
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.recover_source_run != '' && inputs.recover_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Recheck the current main revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and extract the immutable source-tag artifact
        id: source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_TAG: ${{ inputs.recover_tag }}
        run: >-
          python3 scripts/release_artifact_source.py --run-id "${{ inputs.recover_source_run }}"
          --zip source-artifacts.zip --dist dist --server recovered-server.json

      - name: Recheck the source distributions and OCI archive
        env:
          VERSION: ${{ steps.source.outputs.version }}
          REQUIRED_TAG: ${{ inputs.recover_tag }}
        run: |
          set -euo pipefail
          test -f dist/tapebasis-image.tar
          test -f "dist/tapebasis-${VERSION}-py3-none-any.whl"
          test -f "dist/tapebasis-${VERSION}.tar.gz"
          test -f "dist/tapebasis-${VERSION}.tgz"
          (cd dist && sha256sum --check --strict SHA256SUMS)
          python3 scripts/check_oci_image.py dist/tapebasis-image.tar
          cmp server.json recovered-server.json
          python3 scripts/check_release.py --tag "${REQUIRED_TAG}"

  recover-mcp:
    name: Verify packages and complete missing MCP metadata
    needs: recover-source
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.recover_source_run != '' && inputs.recover_tag != ''
    runs-on: ubuntu-latest
    environment: release-recovery
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Recover the same tested source artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_TAG: ${{ inputs.recover_tag }}
        run: >-
          python3 scripts/release_artifact_source.py --run-id "${{ inputs.recover_source_run }}"
          --zip source-artifacts.zip --dist dist --server recovered-server.json

      - name: Recheck all recovered package bytes
        env:
          VERSION: ${{ needs.recover-source.outputs.version }}
        run: |
          test -f "dist/tapebasis-${VERSION}-py3-none-any.whl"
          test -f "dist/tapebasis-${VERSION}.tar.gz"
          test -f "dist/tapebasis-${VERSION}.tgz"
          test -f dist/tapebasis-image.tar
          (cd dist && sha256sum --check --strict SHA256SUMS)
          python3 scripts/check_oci_image.py dist/tapebasis-image.tar
          cmp server.json recovered-server.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Require both tested PyPI files without uploading
        env:
          VERSION: ${{ needs.recover-source.outputs.version }}
        run: >-
          python3 scripts/release_registry.py pypi --version "$VERSION"
          --dist dist --require-existing

      - name: Require the tested npm tarball without uploading
        env:
          VERSION: ${{ needs.recover-source.outputs.version }}
          NPM_BOOTSTRAPPED: ${{ vars.TAPEBASIS_NPM_BOOTSTRAPPED }}
        run: |
          set -euo pipefail
          test "$NPM_BOOTSTRAPPED" = 1
          python3 scripts/release_registry.py npm --version "$VERSION" --dist dist --require-existing

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Download and verify the pinned MCP publisher and regctl
        run: |
          set -euo pipefail
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          ./mcp-publisher validate recovered-server.json
          curl --fail --location --silent --show-error --output regctl \
            "https://github.com/regclient/regclient/releases/download/${REGCTL_VERSION}/regctl-linux-amd64"
          echo "${REGCTL_SHA256}  regctl" | sha256sum --check --strict
          chmod +x regctl
          ./mcp-publisher login github-oidc

      - name: Require every tested GHCR tag without writing a tag
        run: bash ./scripts/verify_ghcr.sh "${{ needs.recover-source.outputs.version }}"

      - name: Inspect MCP Registry metadata
        id: mcp
        env:
          VERSION: ${{ needs.recover-source.outputs.version }}
        run: >-
          python3 scripts/release_registry.py mcp --version "$VERSION"
          --server recovered-server.json --output "$GITHUB_OUTPUT"

      - name: Complete only missing MCP Registry metadata
        if: steps.mcp.outputs.mcp_status == 'missing'
        run: ./mcp-publisher publish recovered-server.json

      - name: Verify the exact recovered MCP Registry metadata
        run: >-
          python3 scripts/release_registry.py mcp --version '${{ needs.recover-source.outputs.version }}'
          --server recovered-server.json
