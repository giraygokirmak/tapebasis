# Validate every push, build the release artifacts, and publish them on a v* tag.
#
# Ordinary main and blank manual runs stop after validation: the wheel, sdist,
# npm tarball and OCI image are built and checked, never published. Protected
# main dispatches with exactly one complete input pair may resume one old tag's
# packages, recover only MCP metadata, or write only Release notes. A v* tag
# builds the same
# artifacts once, records their digests, and waits for the protected `release`
# environment before uploading those exact files. Nothing is rebuilt after the
# approval, so the bytes that passed the smoke tests are the bytes that ship.
#
# Tags are not created here. See docs/wiki/Releasing.md for the one-time
# account setup and the release steps.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      recover_source_run:
        description: Approved earlier tag-run id for MCP-only recovery
        required: false
        type: string
      recover_tag:
        description: Existing immutable tag, exactly matching all package versions
        required: false
        type: string
      resume_source_run:
        description: Earlier tag-run id whose immutable artifacts must finish publishing
        required: false
        type: string
      resume_tag:
        description: Existing immutable source tag, independent of the current main version
        required: false
        type: string
      notes_source_run:
        description: Earlier tag-run id for Release notes only, with no registry publication
        required: false
        type: string
      notes_tag:
        description: Existing immutable tag whose reviewed Release summary must be completed
        required: false
        type: string
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  MCP_PUBLISHER_VERSION: v1.8.9
  MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
  REGCTL_VERSION: v0.11.7
  REGCTL_SHA256: 3737fbbdd791e04e7a831640b681f3397a376498e80e2ad9b1b2d27296f239bc

jobs:
  validate:
    name: Validate
    if: github.event_name != 'workflow_dispatch' || (inputs.recover_source_run == '' && inputs.recover_tag == '' && inputs.resume_source_run == '' && inputs.resume_tag == '' && inputs.notes_source_run == '' && inputs.notes_tag == '')
    uses: ./.github/workflows/test.yml

  build:
    name: Build release artifacts
    needs: validate
    if: github.event_name != 'workflow_dispatch' || (inputs.recover_source_run == '' && inputs.recover_tag == '' && inputs.resume_source_run == '' && inputs.resume_tag == '' && inputs.notes_source_run == '' && inputs.notes_tag == '')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"

      - id: meta
        name: Validate the release identity and history
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          uv venv
          uv pip install -e ".[dev]"
          if [ "$REF_TYPE" = tag ]; then
            previous=""
            while IFS= read -r candidate; do
              if [ "$candidate" != "$REF_NAME" ]; then
                previous="$candidate"
                break
              fi
            done < <(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname)
            if [ -n "$previous" ]; then
              .venv/bin/python scripts/check_release.py --tag "$REF_NAME" --against "$previous"
            else
              .venv/bin/python scripts/check_release.py --tag "$REF_NAME"
            fi
          else
            .venv/bin/python scripts/check_release.py
          fi
          version="$(.venv/bin/python -c 'from tapebasis import __version__; print(__version__)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate the official MCP Registry manifest
        run: |
          set -euo pipefail
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" mcp-publisher
          ./mcp-publisher validate server.json
          rm -f "$archive" mcp-publisher

      - name: Build the Python distributions
        run: uv build --clear --no-sources --out-dir dist

      - name: Install and smoke-test the built distributions
        env:
          TAPEBASIS_HEALTH_ENABLED: "false"
        run: |
          set -euo pipefail
          for artifact in dist/*; do
            uv run --isolated --no-project --python 3.12 \
              --with "$artifact" tests/smoke_test.py
          done

      - name: Build and smoke-test the npm tarball
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm test
          npm pack --pack-destination dist
          .venv/bin/python -m pytest -q tests/test_packaging.py -k npm

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build the multi-platform OCI archive without publishing it
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=dist/tapebasis-image.tar
          labels: io.modelcontextprotocol.server.name=io.github.giraygokirmak/tapebasis
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Inspect the packaged OCI image
        run: .venv/bin/python scripts/check_oci_image.py dist/tapebasis-image.tar

      - name: Smoke-test the local amd64 image without a registry
        run: |
          set -euo pipefail
          docker build --tag tapebasis-ci:test .
          output="$(docker run --rm --entrypoint tapebasis tapebasis-ci:test --help)"
          echo "$output" | grep -F streamable-http >/dev/null

      - name: Record the artifact digests
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ needs.build.outputs.version }}
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: tapebasis-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      packages: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Recheck the approved tag and metadata
        run: python3 scripts/check_release.py --tag "${GITHUB_REF_NAME}"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-artifacts
          path: dist

      - name: Require the tested distributions to be present
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          test -f "dist/tapebasis-${VERSION}-py3-none-any.whl"
          test -f "dist/tapebasis-${VERSION}.tar.gz"
          test -f "dist/tapebasis-${VERSION}.tgz"
          test -f dist/tapebasis-image.tar
          (cd dist && sha256sum --check --strict SHA256SUMS)
          python3 scripts/check_oci_image.py dist/tapebasis-image.tar

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"

      - name: Verify the packed launcher before upload
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: npm install --global --ignore-scripts "./dist/tapebasis-${VERSION}.tgz"

      - name: Compare the existing PyPI version with tested bytes
        id: pypi
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          python3 scripts/release_registry.py pypi --version "$VERSION"
          --dist dist --output "$GITHUB_OUTPUT"

      # Each attestation covers only a genuinely new distribution file.
      - uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a  # v0.0.7
        if: steps.pypi.outputs.pypi_missing_wheel == 'true'
        with:
          paths: dist/*.whl
      - uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a  # v0.0.7
        if: steps.pypi.outputs.pypi_missing_sdist == 'true'
        with:
          paths: dist/tapebasis-*.tar.gz

      - name: Publish the distributions to PyPI only when absent
        if: steps.pypi.outputs.pypi_status == 'missing' || steps.pypi.outputs.pypi_status == 'partial'
        env:
          VERSION: ${{ needs.build.outputs.version }}
          MISSING_WHEEL: ${{ steps.pypi.outputs.pypi_missing_wheel }}
          MISSING_SDIST: ${{ steps.pypi.outputs.pypi_missing_sdist }}
        run: |
          set -euo pipefail
          files=()
          test "$MISSING_WHEEL" != true || files+=("dist/tapebasis-${VERSION}-py3-none-any.whl")
          test "$MISSING_SDIST" != true || files+=("dist/tapebasis-${VERSION}.tar.gz")
          test "${#files[@]}" -gt 0
          uv publish --trusted-publishing always --check-url https://pypi.org/simple "${files[@]}"

      - name: Verify PyPI after conditional publication
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python3 scripts/release_registry.py pypi --version "$VERSION" --dist dist --require-existing --await-visible

      - name: Compare npm with the tested tarball
        id: npm
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          python3 scripts/release_registry.py npm --version "$VERSION"
          --dist dist --output "$GITHUB_OUTPUT"
      - name: Require the existing npm release to be the documented bootstrap
        if: steps.npm.outputs.npm_status == 'verified'
        env:
          NPM_BOOTSTRAPPED: ${{ vars.TAPEBASIS_NPM_BOOTSTRAPPED }}
        run: test "$NPM_BOOTSTRAPPED" = 1

      - name: Stage an absent npm version for maintainer approval
        id: npm_stage
        if: steps.npm.outputs.npm_status == 'missing'
        env:
          VERSION: ${{ needs.build.outputs.version }}
          NPM_STAGE_TOKEN: ${{ secrets.TAPEBASIS_NPM_STAGE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NPM_STAGE_TOKEN"
          umask 077
          npmrc="$RUNNER_TEMP/npm-stage.npmrc"
          printf '//registry.npmjs.org/:_authToken=${NPM_STAGE_TOKEN}\n' > "$npmrc"
          trap 'rm -f "$npmrc"' EXIT
          NPM_CONFIG_USERCONFIG="$npmrc" \
            npm stage publish "./dist/tapebasis-${VERSION}.tgz" --loglevel verbose
          echo "npm_staged=true" >> "$GITHUB_OUTPUT"

      - name: Report the staged npm version that needs maintainer approval
        if: steps.npm_stage.outputs.npm_staged == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "## npm ${VERSION} is staged, not published"
            echo
            echo "npm rejects this repository's OIDC token exchange with package not found,"
            echo "so CI staged the tested tarball instead of publishing it."
            echo
            echo "1. Open https://www.npmjs.com/package/tapebasis and review the staged version."
            echo "2. Approve it with two-factor authentication."
            echo "3. Dispatch release.yml on main with resume_source_run=$GITHUB_RUN_ID"
            echo "   and resume_tag=$GITHUB_REF_NAME to finish GHCR, MCP and the GitHub Release."
            echo
            echo "GHCR, the MCP Registry and the GitHub Release were intentionally not touched."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::npm ${VERSION} was staged and needs maintainer approval before the remaining registries are completed."

      - name: Verify npm after maintainer approval
        if: steps.npm_stage.outputs.npm_staged != 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          python3 scripts/release_registry.py npm --version "$VERSION"
          --dist dist --require-existing --await-visible

      - name: Install cosign
        if: steps.npm_stage.outputs.npm_staged != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Download and verify mcp-publisher and regctl
        if: steps.npm_stage.outputs.npm_staged != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          ./mcp-publisher validate server.json
          curl --fail --location --silent --show-error --output regctl \
            "https://github.com/regclient/regclient/releases/download/${REGCTL_VERSION}/regctl-linux-amd64"
          echo "${REGCTL_SHA256}  regctl" | sha256sum --check --strict
          chmod +x regctl
          ./mcp-publisher login github-oidc

      - name: Complete 1.1.2 GHCR with a reviewed predecessor for 1.1, 1 and latest
        if: steps.npm_stage.outputs.npm_staged != 'true' && needs.build.outputs.version == '1.1.2'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          PREVIOUS_RELEASE_DIGEST: sha256:18a54e02f28d195030cd02ee1f45088eeb05a34792d532197f143f6a73a209d7
        run: >-
          bash ./scripts/verify_ghcr.sh "$VERSION" publish-missing
          --advance-minor-major-latest-from "$PREVIOUS_RELEASE_DIGEST"

      - name: Complete 1.1.3 GHCR with a reviewed predecessor for 1.1, 1 and latest
        if: steps.npm_stage.outputs.npm_staged != 'true' && needs.build.outputs.version == '1.1.3'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          PREVIOUS_RELEASE_DIGEST: sha256:bfb7bf0adcc6717c0fd3281bc71182078fc861f7b0f49fb73e78018f847dcddd
        run: >-
          bash ./scripts/verify_ghcr.sh "$VERSION" publish-missing
          --advance-minor-major-latest-from "$PREVIOUS_RELEASE_DIGEST"

      - name: Complete 1.1.4 GHCR with a reviewed predecessor for 1.1, 1 and latest
        if: steps.npm_stage.outputs.npm_staged != 'true' && needs.build.outputs.version == '1.1.4'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          PREVIOUS_RELEASE_DIGEST: sha256:08ded4615b33333c7c0ca988916da4c94f1339b53d664bdaea5b1d4c6f6f9028
        run: >-
          bash ./scripts/verify_ghcr.sh "$VERSION" publish-missing
          --advance-minor-major-latest-from "$PREVIOUS_RELEASE_DIGEST"

      - name: Complete 1.2.0 GHCR with a reviewed predecessor for 1.2, 1 and latest
        if: steps.npm_stage.outputs.npm_staged != 'true' && needs.build.outputs.version == '1.2.0'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          PREVIOUS_RELEASE_DIGEST: sha256:c16423260ee6a777f2fa79e9b799da7e9552b136593d314e09243121b1397597
        run: >-
          bash ./scripts/verify_ghcr.sh "$VERSION" publish-missing
          --advance-minor-major-latest-from "$PREVIOUS_RELEASE_DIGEST"

      - name: Complete other GHCR releases without replacing matching tags
        if: steps.npm_stage.outputs.npm_staged != 'true' && needs.build.outputs.version != '1.1.2' && needs.build.outputs.version != '1.1.3' && needs.build.outputs.version != '1.1.4' && needs.build.outputs.version != '1.2.0'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: bash ./scripts/verify_ghcr.sh "$VERSION" publish-missing

      - name: Check MCP Registry metadata before publishing
        id: mcp
        if: steps.npm_stage.outputs.npm_staged != 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          python3 scripts/release_registry.py mcp --version "$VERSION"
          --server server.json --output "$GITHUB_OUTPUT"

      - name: Publish the server to the MCP Registry only when absent
        if: steps.npm_stage.outputs.npm_staged != 'true' && steps.mcp.outputs.mcp_status == 'missing'
        run: ./mcp-publisher publish server.json

      - name: Recheck the published MCP Registry metadata
        if: steps.npm_stage.outputs.npm_staged != 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          python3 scripts/release_registry.py mcp --version "$VERSION"
          --server server.json

      - name: Create or update the source tag's reviewed GitHub Release notes
        if: steps.npm_stage.outputs.npm_staged != 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_NOTES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/release_notes.py --tag "$RELEASE_TAG" --version "$VERSION"
          --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --token "$RELEASE_NOTES_TOKEN"

  notes-source:
    name: Validate immutable artifacts for protected Release notes only
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.notes_source_run != '' && inputs.notes_tag != '' && inputs.recover_source_run == '' && inputs.recover_tag == '' && inputs.resume_source_run == '' && inputs.resume_tag == ''
    runs-on: ubuntu-latest
    environment: release-notes
    concurrency:
      group: tapebasis-release-notes
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind the old tag and artifact without publishing registry content
        id: source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_TAG: ${{ inputs.notes_tag }}
          NOTES_RUN: ${{ inputs.notes_source_run }}
        run: >-
          python3 scripts/release_artifact_source.py --source-only --notes-only
          --run-id "$NOTES_RUN" --zip source-artifacts.zip --dist dist --server source-server.json

      - name: Publish the reviewed notes from the dispatched main commit
        env:
          NOTES_TAG: ${{ inputs.notes_tag }}
          NOTES_VERSION: ${{ steps.source.outputs.version }}
          SOURCE_COMMIT: ${{ steps.source.outputs.tag_commit }}
          RELEASE_NOTES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/release_notes.py --tag "$NOTES_TAG" --version "$NOTES_VERSION"
          --commit "$SOURCE_COMMIT" --repository "$GITHUB_REPOSITORY" --token "$RELEASE_NOTES_TOKEN"

  resume-source:
    name: Validate immutable artifacts for protected publication continuation
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.resume_source_run != '' && inputs.resume_tag != '' && inputs.notes_source_run == '' && inputs.notes_tag == '' && inputs.recover_source_run == '' && inputs.recover_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.source.outputs.version }}
      artifact_digest: ${{ steps.source.outputs.artifact_digest }}
      tag_commit: ${{ steps.source.outputs.tag_commit }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Bind source tag, metadata, commit and immutable artifact
        id: source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_TAG: ${{ inputs.resume_tag }}
          RESUME_RUN: ${{ inputs.resume_source_run }}
        run: >-
          python3 scripts/release_artifact_source.py --source-only
          --run-id "$RESUME_RUN"
          --zip source-artifacts.zip --dist dist --server source-server.json

  resume-publication:
    name: Continue protected publication from tested source artifacts
    needs: resume-source
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.resume_source_run != '' && inputs.resume_tag != '' && inputs.notes_source_run == '' && inputs.notes_tag == '' && inputs.recover_source_run == '' && inputs.recover_tag == ''
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: tapebasis-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      packages: write
      attestations: write
    env:
      VERSION: ${{ needs.resume-source.outputs.version }}
      NPM_BOOTSTRAPPED: ${{ vars.TAPEBASIS_NPM_BOOTSTRAPPED }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Independently recover the bound source artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_TAG: ${{ inputs.resume_tag }}
          RESUME_RUN: ${{ inputs.resume_source_run }}
        run: >-
          python3 scripts/release_artifact_source.py --source-only
          --run-id "$RESUME_RUN"
          --zip source-artifacts.zip --dist dist --server source-server.json

      - name: Require the exact tested source files
        run: |
          set -euo pipefail
          test -f "dist/tapebasis-${VERSION}-py3-none-any.whl"
          test -f "dist/tapebasis-${VERSION}.tar.gz"
          test -f "dist/tapebasis-${VERSION}.tgz"
          test -f dist/tapebasis-image.tar
          (cd dist && sha256sum --check --strict SHA256SUMS)
          python3 scripts/check_oci_image.py dist/tapebasis-image.tar

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Verify the source npm launcher before any upload
        run: npm install --global --ignore-scripts "./dist/tapebasis-${VERSION}.tgz"

      - name: Compare the existing source PyPI version with tested bytes
        id: pypi
        run: >-
          python3 scripts/release_registry.py pypi --version "$VERSION"
          --dist dist --output "$GITHUB_OUTPUT"

      - uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7
        if: steps.pypi.outputs.pypi_missing_wheel == 'true'
        with:
          paths: dist/*.whl
      - uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7
        if: steps.pypi.outputs.pypi_missing_sdist == 'true'
        with:
          paths: dist/tapebasis-*.tar.gz

      - name: Publish only the missing source PyPI distributions
        if: steps.pypi.outputs.pypi_status == 'missing' || steps.pypi.outputs.pypi_status == 'partial'
        env:
          MISSING_WHEEL: ${{ steps.pypi.outputs.pypi_missing_wheel }}
          MISSING_SDIST: ${{ steps.pypi.outputs.pypi_missing_sdist }}
        run: |
          set -euo pipefail
          files=()
          test "$MISSING_WHEEL" != true || files+=("dist/tapebasis-${VERSION}-py3-none-any.whl")
          test "$MISSING_SDIST" != true || files+=("dist/tapebasis-${VERSION}.tar.gz")
          test "${#files[@]}" -gt 0
          uv publish --trusted-publishing always --check-url https://pypi.org/simple "${files[@]}"

      - name: Verify source PyPI bytes with bounded visibility waiting
        run: python3 scripts/release_registry.py pypi --version "$VERSION" --dist dist --require-existing --await-visible

      - name: Compare source npm with the tested tarball
        id: npm
        run: >-
          python3 scripts/release_registry.py npm --version "$VERSION"
          --dist dist --output "$GITHUB_OUTPUT"

      - name: Require the marker only for an already existing npm bootstrap
        if: steps.npm.outputs.npm_status == 'verified'
        run: test "$NPM_BOOTSTRAPPED" = 1

      - name: Stage the missing source npm version for maintainer approval
        id: npm_stage
        if: steps.npm.outputs.npm_status == 'missing'
        env:
          NPM_STAGE_TOKEN: ${{ secrets.TAPEBASIS_NPM_STAGE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NPM_STAGE_TOKEN"
          umask 077
          npmrc="$RUNNER_TEMP/npm-stage.npmrc"
          printf '//registry.npmjs.org/:_authToken=${NPM_STAGE_TOKEN}\n' > "$npmrc"
          trap 'rm -f "$npmrc"' EXIT
          NPM_CONFIG_USERCONFIG="$npmrc" \
            npm stage publish "./dist/tapebasis-${VERSION}.tgz" --loglevel verbose
          echo "npm_staged=true" >> "$GITHUB_OUTPUT"

      - name: Report the staged source npm version that needs maintainer approval
        if: steps.npm_stage.outputs.npm_staged == 'true'
        run: |
          {
            echo "## npm ${VERSION} is staged, not published"
            echo
            echo "npm rejects this repository's OIDC token exchange with package not found,"
            echo "so CI staged the tested tarball instead of publishing it."
            echo
            echo "1. Open https://www.npmjs.com/package/tapebasis and review the staged version."
            echo "2. Approve it with two-factor authentication."
            echo "3. Re-dispatch this workflow with the same inputs to finish GHCR, MCP and the GitHub Release."
            echo
            echo "GHCR, the MCP Registry and the GitHub Release were intentionally not touched."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::npm ${VERSION} was staged and needs maintainer approval before the remaining registries are completed."

      - name: Verify source npm integrity with bounded visibility waiting
        if: steps.npm_stage.outputs.npm_staged != 'true'
        run: python3 scripts/release_registry.py npm --version "$VERSION" --dist dist --require-existing --await-visible

      - if: steps.npm_stage.outputs.npm_staged != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify the cosigned publisher and regctl
        if: steps.npm_stage.outputs.npm_staged != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          ./mcp-publisher validate source-server.json
          curl --fail --location --silent --show-error --output regctl \
            "https://github.com/regclient/regclient/releases/download/${REGCTL_VERSION}/regctl-linux-amd64"
          echo "${REGCTL_SHA256}  regctl" | sha256sum --check --strict
          chmod +x regctl
          ./mcp-publisher login github-oidc

      - name: Complete GHCR with a specifically reviewed predecessor for 1 and latest
        if: steps.npm_stage.outputs.npm_staged != 'true' && inputs.resume_tag == 'v1.1.1'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_RELEASE_DIGEST: sha256:4ff12fdcdc79e7c5cd065a3ffb685dcbe6daee518442b7751e0479e0da1e3167
        run: >-
          bash ./scripts/verify_ghcr.sh "$VERSION" publish-missing
          --advance-major-latest-from "$PREVIOUS_RELEASE_DIGEST"

      - name: Complete other GHCR releases from source OCI archives without replacing matches
        if: steps.npm_stage.outputs.npm_staged != 'true' && inputs.resume_tag != 'v1.1.1' && inputs.resume_tag != 'v1.1.2' && inputs.resume_tag != 'v1.1.3' && inputs.resume_tag != 'v1.1.4' && inputs.resume_tag != 'v1.2.0'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./scripts/verify_ghcr.sh "$VERSION" publish-missing

      - name: Complete 1.1.2 GHCR with a reviewed predecessor for 1.1, 1 and latest
        if: steps.npm_stage.outputs.npm_staged != 'true' && inputs.resume_tag == 'v1.1.2'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_RELEASE_DIGEST: sha256:18a54e02f28d195030cd02ee1f45088eeb05a34792d532197f143f6a73a209d7
        run: >-
          bash ./scripts/verify_ghcr.sh "$VERSION" publish-missing
          --advance-minor-major-latest-from "$PREVIOUS_RELEASE_DIGEST"

      - name: Complete 1.1.3 GHCR with a reviewed predecessor for 1.1, 1 and latest
        if: steps.npm_stage.outputs.npm_staged != 'true' && inputs.resume_tag == 'v1.1.3'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_RELEASE_DIGEST: sha256:bfb7bf0adcc6717c0fd3281bc71182078fc861f7b0f49fb73e78018f847dcddd
        run: >-
          bash ./scripts/verify_ghcr.sh "$VERSION" publish-missing
          --advance-minor-major-latest-from "$PREVIOUS_RELEASE_DIGEST"

      - name: Complete 1.1.4 GHCR with a reviewed predecessor for 1.1, 1 and latest
        if: steps.npm_stage.outputs.npm_staged != 'true' && inputs.resume_tag == 'v1.1.4'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_RELEASE_DIGEST: sha256:08ded4615b33333c7c0ca988916da4c94f1339b53d664bdaea5b1d4c6f6f9028
        run: >-
          bash ./scripts/verify_ghcr.sh "$VERSION" publish-missing
          --advance-minor-major-latest-from "$PREVIOUS_RELEASE_DIGEST"

      - name: Complete 1.2.0 GHCR with a reviewed predecessor for 1.2, 1 and latest
        if: steps.npm_stage.outputs.npm_staged != 'true' && inputs.resume_tag == 'v1.2.0'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_RELEASE_DIGEST: sha256:c16423260ee6a777f2fa79e9b799da7e9552b136593d314e09243121b1397597
        run: >-
          bash ./scripts/verify_ghcr.sh "$VERSION" publish-missing
          --advance-minor-major-latest-from "$PREVIOUS_RELEASE_DIGEST"

      - name: Compare source MCP Registry metadata
        id: mcp
        if: steps.npm_stage.outputs.npm_staged != 'true'
        run: python3 scripts/release_registry.py mcp --version "$VERSION" --server source-server.json --output "$GITHUB_OUTPUT"

      - name: Publish only missing source MCP Registry metadata
        if: steps.npm_stage.outputs.npm_staged != 'true' && steps.mcp.outputs.mcp_status == 'missing'
        run: ./mcp-publisher publish source-server.json

      - name: Verify the exact source MCP Registry metadata
        if: steps.npm_stage.outputs.npm_staged != 'true'
        run: python3 scripts/release_registry.py mcp --version "$VERSION" --server source-server.json

      - name: Publish the source tag's reviewed GitHub Release notes
        if: steps.npm_stage.outputs.npm_staged != 'true'
        env:
          RESUME_TAG: ${{ inputs.resume_tag }}
          SOURCE_COMMIT: ${{ needs.resume-source.outputs.tag_commit }}
          RELEASE_NOTES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/release_notes.py --tag "$RESUME_TAG" --version "$VERSION"
          --commit "$SOURCE_COMMIT" --repository "$GITHUB_REPOSITORY" --token "$RELEASE_NOTES_TOKEN"

  recover-source:
    name: Validate source artifacts for approved MCP-only recovery
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.recover_source_run != '' && inputs.recover_tag != '' && inputs.resume_source_run == '' && inputs.resume_tag == '' && inputs.notes_source_run == '' && inputs.notes_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Recheck the current main revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and extract the immutable source-tag artifact
        id: source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_TAG: ${{ inputs.recover_tag }}
          RECOVER_RUN: ${{ inputs.recover_source_run }}
        run: >-
          python3 scripts/release_artifact_source.py --run-id "$RECOVER_RUN"
          --zip source-artifacts.zip --dist dist --server recovered-server.json

      - name: Recheck the source distributions and OCI archive
        env:
          VERSION: ${{ steps.source.outputs.version }}
          REQUIRED_TAG: ${{ inputs.recover_tag }}
        run: |
          set -euo pipefail
          test -f dist/tapebasis-image.tar
          test -f "dist/tapebasis-${VERSION}-py3-none-any.whl"
          test -f "dist/tapebasis-${VERSION}.tar.gz"
          test -f "dist/tapebasis-${VERSION}.tgz"
          (cd dist && sha256sum --check --strict SHA256SUMS)
          python3 scripts/check_oci_image.py dist/tapebasis-image.tar
          cmp server.json recovered-server.json
          python3 scripts/check_release.py --tag "${REQUIRED_TAG}"

  recover-mcp:
    name: Verify packages and complete missing MCP metadata
    needs: recover-source
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.recover_source_run != '' && inputs.recover_tag != '' && inputs.resume_source_run == '' && inputs.resume_tag == '' && inputs.notes_source_run == '' && inputs.notes_tag == ''
    runs-on: ubuntu-latest
    environment: release-recovery
    concurrency:
      group: tapebasis-release-mcp-recovery
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Recover the same tested source artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_TAG: ${{ inputs.recover_tag }}
          RECOVER_RUN: ${{ inputs.recover_source_run }}
        run: >-
          python3 scripts/release_artifact_source.py --run-id "$RECOVER_RUN"
          --zip source-artifacts.zip --dist dist --server recovered-server.json

      - name: Recheck all recovered package bytes
        env:
          VERSION: ${{ needs.recover-source.outputs.version }}
        run: |
          test -f "dist/tapebasis-${VERSION}-py3-none-any.whl"
          test -f "dist/tapebasis-${VERSION}.tar.gz"
          test -f "dist/tapebasis-${VERSION}.tgz"
          test -f dist/tapebasis-image.tar
          (cd dist && sha256sum --check --strict SHA256SUMS)
          python3 scripts/check_oci_image.py dist/tapebasis-image.tar
          cmp server.json recovered-server.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Require both tested PyPI files without uploading
        env:
          VERSION: ${{ needs.recover-source.outputs.version }}
        run: >-
          python3 scripts/release_registry.py pypi --version "$VERSION"
          --dist dist --require-existing

      - name: Require the tested npm tarball without uploading
        env:
          VERSION: ${{ needs.recover-source.outputs.version }}
          NPM_BOOTSTRAPPED: ${{ vars.TAPEBASIS_NPM_BOOTSTRAPPED }}
        run: |
          set -euo pipefail
          test "$NPM_BOOTSTRAPPED" = 1
          python3 scripts/release_registry.py npm --version "$VERSION" --dist dist --require-existing

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Download and verify the pinned MCP publisher and regctl
        run: |
          set -euo pipefail
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          ./mcp-publisher validate recovered-server.json
          curl --fail --location --silent --show-error --output regctl \
            "https://github.com/regclient/regclient/releases/download/${REGCTL_VERSION}/regctl-linux-amd64"
          echo "${REGCTL_SHA256}  regctl" | sha256sum --check --strict
          chmod +x regctl
          ./mcp-publisher login github-oidc

      - name: Require every tested GHCR tag without writing a tag
        run: bash ./scripts/verify_ghcr.sh "${{ needs.recover-source.outputs.version }}"

      - name: Inspect MCP Registry metadata
        id: mcp
        env:
          VERSION: ${{ needs.recover-source.outputs.version }}
        run: >-
          python3 scripts/release_registry.py mcp --version "$VERSION"
          --server recovered-server.json --output "$GITHUB_OUTPUT"

      - name: Complete only missing MCP Registry metadata
        if: steps.mcp.outputs.mcp_status == 'missing'
        run: ./mcp-publisher publish recovered-server.json

      - name: Verify the exact recovered MCP Registry metadata
        run: >-
          python3 scripts/release_registry.py mcp --version '${{ needs.recover-source.outputs.version }}'
          --server recovered-server.json
