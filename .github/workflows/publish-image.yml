# Preserve this workflow entry point without publishing a moving main image.
# Release publication is restricted to the tag-gated release.yml workflow.

name: Docker image checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Validate without publishing
    uses: ./.github/workflows/test.yml
