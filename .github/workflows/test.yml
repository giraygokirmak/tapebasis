name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      # A venv, not --system: the Python that setup-uv provisions is externally
      # managed (PEP 668), so --system installs are refused.
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run the hermetic suite and packaging smoke tests
        run: .venv/bin/python -m pytest -q

      - name: Check the npm launcher
        run: |
          npm ci
          npm run check
          npm test
          npm pack --dry-run

      - name: Validate release metadata
        run: .venv/bin/python scripts/check_release.py

      - name: Run the documentation gate
        run: .venv/bin/python scripts/quality_gate.py

      - name: Smoke-test the tool surface
        run: |
          .venv/bin/python - <<'PY'
          import asyncio
          from tapebasis.server import mcp

          tools = asyncio.run(mcp.list_tools())
          names = {tool.name for tool in tools}
          required = {
              "stock_quote", "stock_prices", "stock_screener", "market_indices",
              "stock_news", "stock_options_chain", "stock_earnings",
              "stock_extended_hours", "technical_analysis",
              "stock_filings", "stock_ownership", "stock_chart",
              "bloomberg_quote", "bloomberg_markets",
              "tapebasis_health", "tapebasis_tool_map",
          }
          missing = required - names
          assert not missing, f"missing tools: {sorted(missing)}"
          print(f"{len(names)} tools registered")
          PY
