[project]
name = "tapebasis"
version = "1.0.0"
description = "MCP server that serves TradingView, Finviz, Yahoo Finance, StockAnalysis and Bloomberg market data together, cross-checks every overlapping field, labels each response ALL/TRADINGVIEW/FINVIZ/YAHOO/SA/BLOOMBERG/NONE, and monitors upstream schema drift"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Giray Gokirmak", email = "giray@gokirmak.gen.tr" }
]
urls = { Repository = "https://github.com/giraygokirmak/tapebasis" }
keywords = [
  "mcp", "market-data", "tradingview", "finviz", "yahoo-finance",
  "stockanalysis", "bloomberg", "cross-verification",
  "redundancy", "screener", "technical-analysis", "stocks", "crypto", "agents"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  # Bloomberg gates plain HTTP clients on the TLS fingerprint, so its provider
  # cannot use httpx. Pinned to the 0.16+ API (AsyncSession with `impersonate`);
  # the accessor imports it lazily, so a missing install degrades to a clear
  # NOT_CONFIGURED error rather than a crash at startup.
  "curl_cffi>=0.16",
  "feedparser>=6.0.12",
  "httpx>=0.27",
  # Lower bound 1.14.0: the server uses `from __future__ import annotations`, so
  # annotations reach FastMCP as strings; Tool.from_function in <=1.13.x calls
  # issubclass() on them and dies at import time.
  # Upper bound excludes 2.x: it removed mcp.server.fastmcp, which the provider
  # layer and this server import. Migrating to the 2.x SDK is a deliberate
  # change, not something a rebuild should force.
  "mcp[cli]>=1.14.0,<2",
  "pandas>=2",
  # python-dateutil 3.0.0 rewrote tz.tzfile, which breaks pandas 2.x dateutil
  # time zones with `'NoneType' object has no attribute 'total_seconds'`.
  "python-dateutil>=2.8.2,<3",
  "requests>=2.32",
  # Pinned to ==3.0.0 on purpose: 3.2.0 makes a bare Query() default to a stock
  # preset filter that silently returns 0 rows for crypto/futures scans.
  "tradingview-screener==3.0.0",
  "tradingview-ta>=3.3.0",
  # Sentiment is computed locally when MARKETAUX_API_TOKEN is unset, so the
  # server has a token-free path for market_sentiment/combined_analysis.
  # MIT licensed, ships its 4.5k-entry lexicon as package data (no download).
  "vaderSentiment>=3.3.2,<4",
]

[project.scripts]
tapebasis = "tapebasis.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tapebasis*"]

[tool.setuptools.package-data]
tapebasis = ["providers/tradingview/coinlist/*.txt"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Default runs stay hermetic: no test hits a live upstream unless marked.
addopts = '-m "not live"'
markers = [
  "live: hits TradingView/Finviz/Yahoo/StockAnalysis for real (not run in CI)",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
